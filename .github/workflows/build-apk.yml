name: Build Pixel Runner APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair projeto Android do ZIP
        run: |
          mkdir android-project
          unzip PixelRunnerAndroid-Projeto.zip -d android-project

      - name: Usar o HTML original sem modificá-lo
        run: cp pixel-runner-1.html android-project/PixelRunnerAndroid/app/src/main/assets/index.html

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configurar Android SDK
            - name: Aceitar licenças do Android SDK
        run: yes | sdkmanager --licenses
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android necessária
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar APK
        working-directory: android-project/PixelRunnerAndroid
        run: gradle assembleDebug

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Runner-Fendas-APK
          path: android-project/PixelRunnerAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
